- name: Generate private key if missing
  community.crypto.openssl_privatekey:
    path: "{{ nginx_ssl_key_path }}"
    size: 2048
    type: RSA
    state: present
    mode: "0600"

- name: Generate CSR if missing
  community.crypto.openssl_csr:
    path: "{{ nginx_ssl_csr_path }}"
    privatekey_path: "{{ nginx_ssl_key_path }}"
    common_name: "{{ nginx_server_name }}"
    state: present

- name: Create self-signed certificate if missing (CSR -> cert)
  community.crypto.x509_certificate:
    path: "{{ nginx_ssl_cert_path }}"
    privatekey_path: "{{ nginx_ssl_key_path }}"
    csr_path: "{{ nginx_ssl_csr_path }}"
    provider: selfsigned
    selfsigned_not_after: "+{{ nginx_ssl_days }}d"
    state: present
    mode: "0644"
