{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-counter
  labels:
    app: counter
    release: {{ .Release.Name | quote }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- $host := printf "%s.%s" .Values.global.student .Values.global.domain -}}
  {{- if and .Values.ingress.tls .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ printf "%s-%s" .Values.ingress.tls.secretNamePrefix .Values.global.student | quote }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.routes.frontend.path | quote }}
            pathType: {{ .Values.ingress.routes.frontend.pathType }}
            backend:
              service:
                name: {{ .Values.frontend.name }}
                port:
                  number: {{ .Values.frontend.service.port }}
          - path: {{ .Values.ingress.routes.backend.path | quote }}
            pathType: {{ .Values.ingress.routes.backend.pathType }}
            backend:
              service:
                name: {{ .Values.backend.name }}
                port:
                  number: {{ .Values.backend.service.port }}
{{- end }}
